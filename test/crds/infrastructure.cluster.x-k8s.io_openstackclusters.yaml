# Minimal infrastructure cluster CRD for the local integration tests.
#
# The operator reads the infrastructure cluster as an unstructured object, so the
# schema stays permissive. The cluster.x-k8s.io/v1beta2 label is required: CAPI
# resolves the apiVersion of an infrastructure reference from this contract label.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackclusters.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta2: v1beta1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: OpenStackCluster
    listKind: OpenStackClusterList
    plural: openstackclusters
    singular: openstackcluster
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
